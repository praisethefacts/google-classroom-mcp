[project]
name = "google-classroom-mcp"
version = "0.1.0"
description = "MCP server that gives DeepSeek (and any MCP-capable agent) read-only access to Google Classroom"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "PTFacts" }]
keywords = ["mcp", "model-context-protocol", "google-classroom", "deepseek", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "mcp>=1.2.0,<3",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
example = ["openai>=1.40.0"]

[project.scripts]
google-classroom-mcp = "classroom_mcp.server:main"
google-classroom-mcp-auth = "classroom_mcp.auth:main"

[project.urls]
Repository = "https://github.com/PTFacts/google-classroom-mcp"
Issues = "https://github.com/PTFacts/google-classroom-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classroom_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
